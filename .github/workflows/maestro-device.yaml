name: Maestro device

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
      cold:
        type: boolean
        default: false
    secrets:
      MAESTRO_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  device:
    name: Maestro shard ${{ inputs.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maestro-qa-apk-${{ github.run_attempt }}
          path: qa-apk
      - name: Restore pinned Maestro distribution
        if: ${{ !inputs.cold }}
        id: maestro-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/maestro-2.12.1
          key: maestro-linux-2.12.1-54dbb071
      - name: Install checksum-verified Maestro
        run: bash ci/maestro/install.sh
      - name: Prepare native SDK and KVM
        id: sdk
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager "emulator" "platform-tools" > "$RUNNER_TEMP/sdk-install.log"
          version=$("$ANDROID_HOME/emulator/emulator" -version | awk '/Android emulator version/ {print $4; exit}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Restore clean AVD snapshot and system image
        if: ${{ !inputs.cold }}
        id: avd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.android/avd/ci-api34.avd
            ~/.android/avd/ci-api34.ini
            ${{ steps.sdk.outputs.home }}/system-images/android-34/google_apis/x86_64
          key: avd-ubuntu24-api34-x86_64-pixel2-${{ steps.sdk.outputs.version }}-${{ hashFiles('.github/workflows/maestro-device.yaml') }}
      - name: Create clean snapshot on a cache miss
        if: ${{ inputs.cold || steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: ci-api34
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb shell settings put global window_animation_scale 0
      - name: Save only the clean snapshot before APK installation
        if: ${{ !inputs.cold && steps.avd-cache.outputs.cache-hit != 'true' && github.event.pull_request.head.repo.fork != true }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.android/avd/ci-api34.avd
            ~/.android/avd/ci-api34.ini
            ${{ steps.sdk.outputs.home }}/system-images/android-34/google_apis/x86_64
          key: avd-ubuntu24-api34-x86_64-pixel2-${{ steps.sdk.outputs.version }}-${{ hashFiles('.github/workflows/maestro-device.yaml') }}
      - name: Run isolated cases on the native emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          SHARD: ${{ inputs.shard }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: ci-api34
          force-avd-creation: false
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/maestro/device.sh "$SHARD"
      - name: Upload shard evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-shard-${{ inputs.shard }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
