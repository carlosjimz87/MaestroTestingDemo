name: Maestro Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Benchmark cache mode
        type: choice
        options: [normal, cold]
        default: normal
      run_ai:
        description: Explicitly run the existing external AI checks (may consume existing service credits)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-disabled: ${{ inputs.cache_mode == 'cold' }}
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}
          dependency-graph: disabled
      - name: Test evidence verifier
        run: python3 -m unittest discover -s ci/maestro -p 'test_*.py' -v
      - name: Build APK and blocking lint once
        run: ./gradlew --build-cache assembleDebug lintDebug
      - name: Bind APK to revision
        run: |
          mkdir -p qa-apk
          cp app/build/outputs/apk/debug/app-debug.apk qa-apk/
          python3 ci/maestro/verify.py apk qa-apk
      - name: Upload QA APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-qa-apk-${{ github.run_attempt }}
          path: qa-apk/
          if-no-files-found: error
          retention-days: 7
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-lint-${{ github.run_attempt }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  maestro:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2']
    uses: ./.github/workflows/maestro-device.yaml
    with:
      shard: ${{ matrix.shard }}
      cold: ${{ inputs.cache_mode == 'cold' }}

  maestro-ai:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai }}
    needs: build
    uses: ./.github/workflows/maestro-device.yaml
    with:
      shard: ai
      cold: ${{ inputs.cache_mode == 'cold' }}
    secrets:
      MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}

  maestro-e2e:
    name: maestro-e2e
    if: always()
    needs: [build, maestro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      SHARDS_RESULT: ${{ needs.maestro.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: maestro-shard-1-${{ github.run_attempt }}
          path: reports/shard-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: maestro-shard-2-${{ github.run_attempt }}
          path: reports/shard-2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: maestro-qa-apk-${{ github.run_attempt }}
          path: reports/apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: maestro-lint-${{ github.run_attempt }}
          path: reports/lint
      - name: Require exactly twelve passing cases from this attempt
        run: python3 ci/maestro/verify.py verify reports
      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-test-results-${{ github.run_attempt }}
          path: |
            reports/
            !reports/apk/*.apk
          if-no-files-found: error
          retention-days: 7

  pages:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: maestro-e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maestro-test-results-${{ github.run_attempt }}
          path: public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
