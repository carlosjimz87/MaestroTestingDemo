appId: com.carlosjimz87.maestrotestingdemo

---

- runFlow: ../subflows/login.yaml

# Wait for list to load
- extendedWaitUntil:
    visible: "Buy groceries"
    timeout: 10000

# Start near the right edge of the containing row, rather than the title's
# center, so the gesture crosses the swipe-to-dismiss distance threshold.
- swipe:
    from:
      containsChild:
        text: "Buy groceries"
      point: "90%, 50%"
    direction: LEFT
    duration: 600

- waitForAnimationToEnd

# Verify item is gone
- assertNotVisible: "Buy groceries"

- takeScreenshot: screenshots/07_task_swipe_delete
